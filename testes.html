<title>Testes do Matriz Engenharia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
/* Ferramenta de campo: uma coluna, cartões por item, botões grandes. Identidade da Matriz (marinho + ouro). */
:root {
  --bg: #F2F4F7; --card: #FFFFFF; --ink: #1B2A47; --muted: #5A6478; --line: #DDE2EA;
  --ouro: #C8A24F; --ouro-ink: #7A5E1C; --ouro-tint: #F6EFDD;
  --ok: #1E7A4C; --ok-tint: #E3F3EA; --red: #B3362C; --red-tint: #FBE6E4;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1626; --card: #18233A; --ink: #E6EAF2; --muted: #A3ADC2; --line: #2A3752;
  --ouro: #D4B166; --ouro-ink: #E3C88A; --ouro-tint: #2C2717;
  --ok: #6FD3A0; --ok-tint: #133326; --red: #F08C82; --red-tint: #3A1C1A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1626; --card: #18233A; --ink: #E6EAF2; --muted: #A3ADC2; --line: #2A3752;
  --ouro: #D4B166; --ouro-ink: #E3C88A; --ouro-tint: #2C2717;
  --ok: #6FD3A0; --ok-tint: #133326; --red: #F08C82; --red-tint: #3A1C1A; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
.pagina { max-width: 760px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }
.mono { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 24px; line-height: 1.25; margin: 4px 0 8px; text-wrap: balance; }
h2 { margin: 0; }
p { margin: 0; }
.rodada { display: grid; gap: 12px; }
.antes { background: var(--ouro-tint); border: 1px solid var(--ouro); border-radius: 6px; padding: 12px 16px; }
.antes b { color: var(--ouro-ink); }
.placar { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.placar span { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: 14px; }
.grupo { display: grid; gap: 12px; }
.item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.item.funcionou { border-left: 5px solid var(--ok); }
.item.problema { border-left: 5px solid var(--red); }
.item h3 { font-size: 18px; margin: 0; line-height: 1.3; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); }
ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }
.esperado { border-top: 1px solid var(--line); padding-top: 10px; }
.esperado .mono { display: block; margin-bottom: 2px; }
.grava { font-size: 14px; color: var(--muted); }
.botoes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.botoes button { min-height: 48px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: 600 15px var(--sans); cursor: pointer; }
.botoes button[aria-pressed="true"].b-testar { border-color: var(--ink); background: var(--ink); color: var(--card); }
.botoes button[aria-pressed="true"].b-funcionou { border-color: var(--ok); background: var(--ok-tint); color: var(--ok); }
.botoes button[aria-pressed="true"].b-problema { border-color: var(--red); background: var(--red-tint); color: var(--red); }
.botoes button:disabled { opacity: .5; cursor: default; }
label.obs { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
textarea { font: 16px/1.4 var(--sans); min-height: 72px; padding: 8px 12px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
textarea:focus, button:focus-visible { outline: 3px solid var(--ouro); outline-offset: 1px; }
.salvo { font-size: 13px; color: var(--muted); min-height: 18px; }
.aviso { background: var(--card); border: 1px dashed var(--line); border-radius: 8px; padding: 16px; color: var(--muted); }
@media (hover: hover) { .botoes button:not(:disabled):hover { border-color: var(--ouro); } }
@media (prefers-reduced-motion: no-preference) { .botoes button:active { transform: scale(.98); } }
</style>

<div class="pagina">
  <header class="rodada">
    <div>
      <div class="mono">Página de testes · Matriz Engenharia</div>
      <h1 id="rodada-nome">Carregando a rodada…</h1>
      <p id="rodada-nota"></p>
    </div>
    <div class="antes" id="rodada-antes" hidden></div>
    <div class="placar" id="placar"></div>
  </header>
  <main id="lista"><div class="aviso">Carregando os itens…</div></main>
</div>

<script>
const STATUS = [['A testar', 'b-testar'], ['Funcionou', 'b-funcionou'], ['Problema', 'b-problema']]
const $ = (id) => document.getElementById(id)
let db = null
let podeGravar = true
let itens = []
const editando = new Set()

function el(tag, attrs = {}, ...filhos) {
  const e = document.createElement(tag)
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v)
    else e.setAttribute(k, v)
  }
  for (const f of filhos.flat()) if (f !== null && f !== undefined) e.append(f.nodeType ? f : document.createTextNode(String(f)))
  return e
}

// Texto com **negrito** para os nomes exatos da tela.
function rico(texto) {
  const span = document.createElement('span')
  String(texto).split(/(\*\*[^*]+\*\*)/).forEach((p) => {
    if (p.startsWith('**') && p.endsWith('**')) span.append(el('b', {}, p.slice(2, -2)))
    else if (p) span.append(document.createTextNode(p))
  })
  return span
}

async function gravar(id, campos, aviso) {
  try {
    await db.collection('itens').doc(id).update(campos)
    if (aviso) aviso.textContent = 'Salvo.'
  } catch (e) {
    if (aviso) aviso.textContent = e?.code === 'invalid_argument' ? 'Você não tem permissão para marcar nesta página.' : 'Não salvou. Confira a internet e tente de novo.'
  }
}

function cartao(it) {
  const aviso = el('div', { class: 'salvo', 'aria-live': 'polite' })
  const botoes = el('div', { class: 'botoes', role: 'group', 'aria-label': 'Resultado do teste' },
    STATUS.map(([s, cls]) => el('button', {
      type: 'button', class: cls, 'aria-pressed': String((it.status || 'A testar') === s),
      ...(podeGravar ? {} : { disabled: '' }),
      onclick: () => { aviso.textContent = 'Salvando…'; gravar(it.id, { status: s }, aviso) },
    }, s)))
  const areaId = 'obs-' + it.id
  const area = el('textarea', { id: areaId, placeholder: 'O que você viu (obrigatório quando der Problema)' })
  area.value = it.obs || ''
  if (!podeGravar) area.disabled = true
  area.addEventListener('focus', () => editando.add(it.id))
  area.addEventListener('blur', () => {
    editando.delete(it.id)
    if (area.value !== (it.obs || '')) { aviso.textContent = 'Salvando…'; gravar(it.id, { obs: area.value }, aviso) }
  })
  const estado = (it.status || 'A testar') === 'Funcionou' ? 'funcionou' : it.status === 'Problema' ? 'problema' : ''
  return el('article', { class: 'item ' + estado, id: 'item-' + it.id },
    el('h3', {}, it.titulo),
    el('div', { class: 'meta' }, it.conta ? el('span', {}, 'Conta: ', el('b', {}, it.conta)) : null, it.obra ? el('span', {}, 'Obra: ', el('b', {}, it.obra)) : null),
    el('ol', {}, (it.passos || []).map((p) => el('li', {}, rico(p)))),
    el('div', { class: 'esperado' }, el('span', { class: 'mono' }, 'Esperado'), rico(it.esperado || '')),
    it.grava ? el('div', { class: 'grava' }, rico(it.grava)) : null,
    botoes,
    el('label', { class: 'obs', for: areaId }, 'Observação', area),
    aviso,
  )
}

function desenhar() {
  const cont = { 'A testar': 0, Funcionou: 0, Problema: 0 }
  itens.forEach((i) => { cont[i.status || 'A testar']++ })
  $('placar').replaceChildren(...Object.entries(cont).map(([k, v]) => el('span', {}, `${k}: ${v}`)))
  if (!itens.length) { $('lista').replaceChildren(el('div', { class: 'aviso' }, 'Nada a testar agora.')); return }
  // Não redesenha um cartão enquanto a pessoa escreve nele.
  if (editando.size) return
  const modulos = [...new Set(itens.map((i) => i.modulo))]
  $('lista').replaceChildren(...modulos.map((m) => el('section', { class: 'grupo' },
    el('h2', { class: 'mono' }, m),
    itens.filter((i) => i.modulo === m).map(cartao))))
}

async function iniciar() {
  db = await claude.use('db')
  if (!db) { $('lista').replaceChildren(el('div', { class: 'aviso' }, 'Abra esta página no claude.ai, com a sua conta, para ver e marcar os testes.')); $('rodada-nome').textContent = 'Testes do Matriz Engenharia'; return }
  const user = await claude.use('user')
  if (user && (await user.can('data.write')) === false) podeGravar = false
  const espera = setTimeout(() => { if (!itens.length) $('lista').replaceChildren(el('div', { class: 'aviso' }, 'Os itens ainda não chegaram. Confira a internet; a página tenta de novo sozinha.')) }, 10000)
  db.doc('rodada/atual').onSnapshot((s) => {
    const r = s.data() || {}
    $('rodada-nome').textContent = r.nome || 'Testes do Matriz Engenharia'
    $('rodada-nota').textContent = r.nota || ''
    $('rodada-antes').hidden = !r.antes
    $('rodada-antes').replaceChildren(rico(r.antes || ''))
  })
  db.collection('itens').orderBy('ordem').onSnapshot((snap) => {
    if (!snap.metadata.fromCache) clearTimeout(espera)
    itens = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
    desenhar()
  }, () => { clearTimeout(espera); $('lista').replaceChildren(el('div', { class: 'aviso' }, 'Não foi possível carregar os itens. Recarregue a página.')) })
}
iniciar()
</script>
