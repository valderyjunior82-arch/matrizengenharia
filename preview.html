<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matriz Obra · Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* paleta do usuário */
  --ink:#26333A; --slate:#4A5A63; --bg:#F2F4F5; --teal:#00A3B4; --red:#E2574C;
  /* derivadas */
  --card:#FFFFFF; --line:#DCE1E4; --line2:#E9EDEF; --muted:#56656D;
  --ink-2:#1B262C; --teal-ink:#00727E; --teal-tint:#E0F4F6;
  --red-ink:#B5382E; --red-tint:#FCEDEB;
  --amb:#E8A317; --amb-ink:#7F5400; --amb-tint:#FFF3D6;
  --grn:#2E9E6B; --grn-ink:#1B6B45; --grn-tint:#E3F4EB;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.07em;font-size:12px;font-weight:600}

/* faixa do mockup */
.mock{background:var(--teal-tint);color:var(--teal-ink);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid #BFE6EB}
.mock button{text-decoration:underline;font-weight:600;min-height:32px}

/* estrutura */
.app{min-height:100vh}
.side{display:none}
.main{padding-bottom:150px;min-width:0}
.top{background:var(--ink);color:#fff}
.top-in{padding:14px 16px 12px;display:flex;gap:12px;align-items:flex-start}
.mark{width:22px;height:22px;border-radius:4px;background:var(--teal);flex:none;margin-top:3px}
.obra{flex:1;min-width:0}
.obra h1{font-size:19px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obra .sub{color:#B9C5CB;margin-top:3px;font-size:11.5px}
.trocar{background:#3A4952;color:#fff;border-radius:4px;padding:0 12px;min-height:44px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.07em;display:flex;align-items:center;gap:6px;flex:none}
.trocar:hover{background:#465761}
.back{display:flex;align-items:center;gap:6px;min-height:44px;color:#fff;font-weight:600;padding-right:8px}
.tabs{display:flex;gap:4px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:44px;padding:0 10px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.07em;color:#B9C5CB;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:var(--teal)}
.tab .n{opacity:.8;margin-left:4px}

.view{padding:12px;display:grid;gap:10px;max-width:1180px}

/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);min-height:44px}
.ch .mono{color:var(--slate)}
.link{color:var(--teal-ink);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.07em;min-height:44px;display:inline-flex;align-items:center;padding:0 2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--slate);border-radius:var(--r);padding:10px 10px 12px;text-align:left;min-height:44px}
.stat .mono{color:var(--slate);font-size:11px}
.stat .num{font-size:44px;font-weight:600;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.stat .ft{font-size:12px;color:var(--muted);line-height:1.3}
.stat.red{border-top-color:var(--red)} .stat.red .num{color:var(--red-ink)}
.stat.amb{border-top-color:var(--amb)} .stat.amb .num{color:var(--amb-ink)}
.stat.teal{border-top-color:var(--teal)} .stat.teal .num{color:var(--teal-ink)}
.stat.grn{border-top-color:var(--grn)} .stat.grn .num{color:var(--grn-ink)}

/* barra de avanço */
.prog{padding:12px 14px 14px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prog .big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{position:relative;height:10px;background:var(--line2);border-radius:5px;margin:10px 0 8px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:5px}
.bar b{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--ink);border-radius:2px}
.prog .legend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}

/* linhas de lista */
.li{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line2);min-height:64px;position:relative}
.li:last-child{border-bottom:0}
button.li:hover{background:#F7F9FA}
.li::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent}
.li.red{background:var(--red-tint)} .li.red::before{background:var(--red)}
.li.amb::before{background:var(--amb)}
.li.grn::before{background:var(--grn)}
.li .b{flex:1;min-width:0}
.li .t{font-size:16px;font-weight:600;line-height:1.25}
.li .m{color:var(--muted);margin-top:4px;font-size:11.5px}
.li .r{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.li .s{font-size:12.5px;color:var(--muted)}
.li .s strong{color:var(--ink);font-size:15px}

.chip{display:inline-flex;align-items:center;font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:3px;white-space:nowrap;border:1px solid transparent}
.chip.red{background:var(--red-ink);color:#fff}
.chip.amb{background:var(--amb-tint);color:var(--amb-ink);border-color:#F2D38A}
.chip.grn{background:var(--grn-tint);color:var(--grn-ink);border-color:#B8E0CA}
.chip.teal{background:var(--teal-tint);color:var(--teal-ink);border-color:#B5E3E9}
.chip.gray{background:var(--line2);color:var(--slate)}

.mini{height:6px;background:var(--line2);border-radius:3px;width:84px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--teal)}

/* botões */
.btn{min-height:44px;padding:0 16px;border-radius:5px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--teal);color:var(--ink-2)}
.btn.pri:hover{background:#00B4C6}
.btn.sec{background:#fff;border:1.5px solid var(--slate);color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.full{width:100%}
.btn.lg{min-height:56px;font-size:17px}

.aprovar{padding:12px 14px;display:grid;gap:10px}
.aprovar .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo .card{padding:10px 12px;text-align:left;min-height:64px}
.duo .mono{color:var(--slate);font-size:11px}
.duo .v{font-weight:600;margin-top:5px}
.duo .v.red{color:var(--red-ink)} .duo .v.amb{color:var(--amb-ink)} .duo .v.grn{color:var(--grn-ink)}

.fin{display:grid;grid-template-columns:1fr 1fr}
.fin > div{padding:12px 14px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.fin > div:nth-child(2n){border-right:0}
.fin > div:nth-last-child(-n+2){border-bottom:0}
.fin .mono{color:var(--slate);font-size:11px}
.fin .v{font-size:21px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.fin .x{font-size:12.5px;color:var(--red-ink);font-weight:600;margin-top:3px}

/* fotos (marcadores de lugar) */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 14px}
.ph{aspect-ratio:1;border-radius:4px;position:relative;overflow:hidden;background:repeating-linear-gradient(135deg,#D3DADE 0 9px,#C9D1D6 9px 18px);display:flex;align-items:flex-end}
.ph.t2{background:repeating-linear-gradient(45deg,#CFD8D3 0 9px,#C3CEC8 9px 18px)}
.ph.t3{background:repeating-linear-gradient(135deg,#DCD6CE 0 9px,#D1CAC1 9px 18px)}
.ph span{background:rgba(38,51,58,.86);color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 5px;margin:5px;border-radius:2px;max-width:calc(100% - 10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayh{padding:12px 14px 0;color:var(--slate)}

/* chips de filtro */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:#fff;font-weight:500;white-space:nowrap;font-size:15px}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.group summary{list-style:none;cursor:pointer}
.group summary::-webkit-details-marker{display:none}
.group summary .ch{border-bottom:1px solid var(--line2)}
.group:not([open]) summary .ch{border-bottom:0}
.caret{transition:transform .15s;display:inline-block}
.group[open] .caret{transform:rotate(90deg)}

/* detalhe */
.dhead{padding:14px}
.dhead h2{font-size:22px;font-weight:600;line-height:1.2}
.dhead .m{color:var(--muted);margin-top:6px}
.kv{display:grid;grid-template-columns:1fr 1fr}
.kv > div{padding:10px 14px;border-top:1px solid var(--line2)}
.kv > div:nth-child(odd){border-right:1px solid var(--line2)}
.kv .mono{color:var(--slate);font-size:11px}
.kv .v{font-weight:600;margin-top:3px}
.seg{display:flex;border-bottom:1px solid var(--line2);overflow-x:auto}
.seg button{flex:1;min-height:48px;font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.07em;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;padding:0 10px}
.seg button.on{color:var(--ink);border-bottom-color:var(--teal)}
.entry{padding:12px 14px;border-bottom:1px solid var(--line2)}
.entry:last-child{border-bottom:0}
.entry .m{color:var(--muted);font-size:11.5px;margin-top:4px}
.entry .tx{font-size:16px;margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;border-top:1px solid var(--line2)}

/* diário de hoje */
.hoje{background:var(--ink);color:#fff;border-radius:var(--r);padding:14px;display:grid;gap:12px}
.hoje .mono{color:#9FD9E0}
.hoje h2{font-size:20px;font-weight:600}
.hoje p{color:#C9D3D8;font-size:15px}

/* estado vazio */
.empty{padding:40px 20px 36px;text-align:center;display:grid;justify-items:center;gap:12px}
.empty .ic{width:72px;height:72px;border-radius:50%;background:var(--teal-tint);color:var(--teal-ink);display:grid;place-items:center}
.empty h3{font-size:19px;font-weight:600;max-width:320px}
.empty p{color:var(--muted);max-width:340px;font-size:15px}
.empty .btn{margin-top:6px}

/* navegação inferior */
.bnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-top:3px solid transparent}
.bnav button.on{color:var(--teal-ink);border-top-color:var(--teal)}
.fab{position:fixed;right:14px;bottom:78px;z-index:21;background:var(--teal);color:var(--ink-2);min-height:52px;padding:0 18px 0 14px;border-radius:26px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(38,51,58,.28)}

/* folha de troca de obra */
.veil{position:fixed;inset:0;background:rgba(20,28,32,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.veil.on{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:12px 12px 0 0;padding:8px 0 16px}
.sheet .ch{border-bottom:1px solid var(--line2)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;min-height:64px;border-bottom:1px solid var(--line2)}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--slate);flex:none}
.opt.on .dot{border:6px solid var(--teal)}

.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:6px;font-size:14.5px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* menu "Mais" */
.mais .li{min-height:60px}

/* ===== tela larga: menu lateral ===== */
@media (min-width:900px){
  .app{display:grid;grid-template-columns:252px 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--ink);color:#fff;padding:18px 12px;gap:4px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-family:var(--mono);font-weight:600;letter-spacing:.12em;font-size:14px}
  .brand i{width:18px;height:18px;background:var(--teal);border-radius:3px}
  .snav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:5px;color:#C9D3D8;font-weight:500;text-align:left;width:100%}
  .snav:hover{background:#2F3E46;color:#fff}
  .snav.on{background:#33444D;color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
  .slabel{color:#8FA0A8;padding:18px 12px 6px;font-size:11px}
  .side .grow{flex:1}
  .side .btn.pri{margin:14px 4px 10px}
  .me{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid #3A4952;margin-top:6px}
  .me .av{width:36px;height:36px;border-radius:50%;background:#3A4952;display:grid;place-items:center;font-weight:600;font-size:14px}
  .me small{display:block;color:#9FAEB5;font-size:12px}
  .bnav,.fab{display:none}
  .main{padding-bottom:40px}
  .top-in{padding:18px 24px 14px}
  .obra h1{font-size:22px}
  .tabs{padding:0 18px}
  .view{padding:18px 24px;gap:14px}
  .stats{grid-template-columns:repeat(4,1fr);gap:12px}
  .stat .num{font-size:52px}
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
  .cols > div{display:grid;gap:14px}
  .photos{grid-template-columns:repeat(5,1fr)}
  .toast{bottom:32px}
  .veil{align-items:center}
  .sheet{border-radius:10px}
}
@media (max-width:899px){ .cols, .cols > div{display:grid;gap:10px} .stats .stat:nth-child(4){display:none} }
@media (max-width:380px){ .stat .num{font-size:38px} .fin .v{font-size:18px} }
</style>
</head>

/* ---------- utilidades ---------- */
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const pad=n=>String(n).padStart(2,'0');
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dif=(a,b)=>Math.round((a-b)/864e5);
const fmt=s=>{const x=D(s);return pad(x.getDate())+'/'+pad(x.getMonth()+1)};
const fmtL=s=>{const n=dif(HOJE,D(s));if(n===0)return 'Hoje';if(n===1)return 'Ontem';return WD[D(s).getDay()]+', '+fmt(s)};
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const plural=(n,s,p)=>n+' '+(n===1?s:p);
const F=id=>frentes.find(f=>f.id===id);

function semAndar(f){
  if(f.ult) return dif(HOJE,D(f.ult));
  if(f.ini && D(f.ini)>HOJE) return null;
  return f.ini?dif(HOJE,D(f.ini)):null;
}
function nivel(f){
  if(f.sit==='Concluída'||f.sit==='Aguardando aprovação') return 'grn';
  if(f.lim){const x=dif(D(f.lim),HOJE); if(x<0) return 'red'; if(x<=3) return 'amb';}
  const s=semAndar(f); if(s!==null && s>=3) return 'amb';
  return 'grn';
}
function limChip(f){
  if(f.sit==='Aguardando aprovação') return `<span class="chip teal">aprovar</span>`;
  if(f.sit==='Concluída') return `<span class="chip grn">concluída</span>`;
  if(!f.lim) return `<span class="chip gray">sem limite</span>`;
  const x=dif(D(f.lim),HOJE), n=nivel(f);
  const t = x<0?`vencida ${-x}d`: x===0?'vence hoje': x===1?'amanhã':`em ${x} dias`;
  return `<span class="chip ${n}">${t}</span>`;
}
function limTxt(f){
  if(!f.lim) return 'Sem data limite';
  const x=dif(D(f.lim),HOJE);
  return x<0?`Vencida há ${plural(-x,'dia','dias')} (${fmt(f.lim)})`: x===0?'Vence hoje': x===1?`Vence amanhã (${fmt(f.lim)})`:`Vence em ${x} dias (${fmt(f.lim)})`;
}
function andarTxt(f){
  if(f.sit==='Concluída') return 'concluída';
  if(f.sit==='Aguardando aprovação') return 'pronta em '+fmt(f.marcada);
  const s=semAndar(f);
  if(s===null) return 'começa em '+fmt(f.ini);
  if(s===0) return '<strong>andou hoje</strong>';
  return `<strong>${s}</strong> ${s===1?'dia':'dias'} sem andar`;
}

    </div>
  </div>
  <div class="card"><div class="seg">${tabs.map(([k,l])=>`<button class="${S.tabFrente===k?'on':''}" onclick="S.tabFrente='${k}';render()">${l.toUpperCase()}</button>`).join('')}</div>${corpo}</div>`;
}

function telaDiario(){
  const ds=diario.filter(d=>d.obra===S.obra);
  const dias=[...new Set(ds.map(d=>d.data))].sort().reverse();
  const nf=ds.reduce((s,d)=>s+d.fotos,0);
  header({tabs:[['dias','Dias',dias.length],['fotos','Fotos',nf]].map(([k,l,c])=>`<button class="tab ${S.tabDiario===k?'on':''}" onclick="S.tabDiario='${k}';render()">${l.toUpperCase()}<span class="n">${c}</span></button>`).join('')});
  const hojeRegs=ds.filter(d=>d.data==='2026-11-23');
  const cartaoHoje=`<div class="hoje"><div class="mono">Diário de hoje · ${WD[HOJE.getDay()]}, 23/11</div>
    <h2>${hojeRegs.length?plural(hojeRegs.length,'registro lançado','registros lançados'):'Nada lançado ainda'}</h2>
    <p>${hojeRegs.length?hojeRegs.map(r=>r.tipo+(r.frente?': '+F(r.frente).serv:'')).join(' · '):'Registre o que cada frente fez, quem veio e o que deu errado. Foto ajuda a provar depois.'}</p>
    <button class="btn pri lg full" onclick="toast('Lançar no diário: formulário fica para a próxima rodada.')">${ico('cam',22)}Lançar no diário</button></div>`;
  if(!dias.length) return cartaoHoje+`<div class="card">${vazio('diario','Nenhum diário lançado nesta obra ainda.','Toque em Lançar no diário para registrar o dia de hoje.',null)}</div>`;
  if(S.tabDiario==='fotos'){
    return cartaoHoje+dias.filter(d=>ds.some(x=>x.data===d&&x.fotos)).map(d=>`<div class="card"><div class="ch"><span class="mono">${fmtL(d)}${dif(HOJE,D(d))>1?'/2026':''}</span><span class="mono" style="color:var(--muted)">${plural(ds.filter(x=>x.data===d).reduce((s,x)=>s+x.fotos,0),'foto','fotos')}</span></div>${fotos(fotosDe(ds.filter(x=>x.data===d)))}</div>`).join('');
  }
  return cartaoHoje+`<div class="card"><div class="ch"><span class="mono">Dias com registro · ${dias.length}</span></div>`+dias.map(d=>{
    const r=ds.filter(x=>x.data===d), av=r.filter(x=>x.tipo==='Avanço').length, oc=r.filter(x=>x.tipo==='Ocorrência').length, ft=r.reduce((s,x)=>s+x.fotos,0);
    return `<button class="li" onclick="ir('dia',{dia:'${d}'})"><div class="b"><div class="t">${fmtL(d)}</div><div class="m mono">${r[0].por} · ${plural(av,'frente andou','frentes andaram')} · ${plural(ft,'foto','fotos')}</div></div>
      <div class="r">${oc?`<span class="chip amb">${plural(oc,'ocorrência','ocorrências')}</span>`:''}${ico('chev',20)}</div></button>`;
  }).join('')+`</div>`;
}

function telaDia(){
  const ds=diario.filter(d=>d.obra===S.obra);
  const dias=[...new Set(ds.map(d=>d.data))].sort();
  const i=dias.indexOf(S.dia);
  const r=ds.filter(d=>d.data===S.dia);
  header({back:['Diário',"ir('diario')"]});
  const nav=`<div class="card" style="display:flex;align-items:center;justify-content:space-between">
    <button class="btn" ${i>0?`onclick="ir('dia',{dia:'${dias[i-1]}'})"`:'disabled style="opacity:.35"'}>${ico('back',22)}</button>
    <div style="text-align:center"><div style="font-size:19px;font-weight:600">${fmtL(S.dia)}</div><div class="mono" style="color:var(--muted)">${fmt(S.dia)}/2026</div></div>
    <button class="btn" ${i<dias.length-1?`onclick="ir('dia',{dia:'${dias[i+1]}'})"`:'disabled style="opacity:.35"'}>${ico('chev',22)}</button></div>`;
  const bloco=(t,l,fn)=>l.length?`<div class="card"><div class="ch"><span class="mono">${t}</span></div>${l.map(fn).join('')}</div>`:'';
  const eq=r.filter(x=>x.tipo==='Equipe'), av=r.filter(x=>x.tipo==='Avanço'), oc=r.filter(x=>x.tipo==='Ocorrência');
  const ft=fotosDe(r);
  return nav
    +bloco('Equipe presente',eq,x=>`<div class="entry"><div class="tx">${x.tx}</div><div class="m mono">${x.por}</div></div>`)
    +bloco('Avanço por frente',av,x=>`<div class="entry"><div style="display:flex;justify-content:space-between;gap:8px"><b>${F(x.frente).serv}</b><span class="chip teal">→ ${x.pct}%</span></div><div class="tx">${x.tx}</div><div class="m mono">${x.por}</div></div>`)
    +bloco('Ocorrências',oc,x=>`<div class="entry" style="border-left:4px solid var(--amb)"><div class="tx">${x.tx}</div><div class="m mono">${x.por}</div></div>`)
    +(ft.length?`<div class="card"><div class="ch"><span class="mono">Fotos do dia · ${ft.length}</span></div>${fotos(ft)}</div>`:'');
}

function linhaMat(m,resumo){
  const x=dif(D(m.ate),HOJE), f=m.frente?F(m.frente):null;
  const venc=x<0&&m.sit!=='Entregue';
  const quando= m.sit==='Entregue'?'entregue':x<0?`atrasado ${-x}d`:x===0?'hoje':x===1?'amanhã':'até '+fmt(m.ate);
  const cor = m.sit==='Entregue'?'grn': venc?'red': x<=2?'amb':'gray';
  const sitChip = m.sit==='A comprar'?'amb':m.sit==='Comprado'?'teal':'grn';
  return `<div class="li ${venc?'red':''}">
    <div class="b"><div class="t">${m.item} <span style="font-weight:500;color:var(--muted)">· ${m.qtd}</span></div>
      <div class="m mono">${f?f.serv:'sem frente'} · ${m.forn||'sem fornecedor'}</div>
      ${!resumo&&m.sit!=='Entregue'?`<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        ${m.sit==='A comprar'?`<button class="btn sec" onclick="mat(${m.id},'Comprado')">Marcar comprado</button>`:''}
        <button class="btn pri" onclick="mat(${m.id},'Entregue')">Marcar entregue</button></div>`:''}
    </div>
    <div class="r"><span class="chip ${cor}">${quando}</span><span class="chip ${sitChip}">${m.sit}</span></div></div>`;
}
function mat(id,sit){materiais.find(m=>m.id===id).sit=sit;toast(`Movido para ${sit}.`);render()}

function telaMateriais(){
  const ms=materiais.filter(m=>m.obra===S.obra);
  const abas=['A comprar','Comprado','Entregue'];
  header({tabs:abas.map(a=>`<button class="tab ${S.tabMat===a?'on':''}" onclick="S.tabMat='${a}';render()">${a.toUpperCase()}<span class="n">${ms.filter(m=>m.sit===a).length}</span></button>`).join('')});
  const top=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <div><div class="mono" style="color:var(--slate)">Materiais · ${S.tabMat}</div><div style="font-size:22px;font-weight:600;margin-top:2px">${plural(ms.filter(m=>m.sit===S.tabMat).length,'item','itens')}</div></div>
    ${ms.length?`<button class="btn dark" onclick="toast('Novo material: próxima rodada.')">+ Novo material</button>`:''}</div>`;
  if(!ms.length) return `<div class="card">${vazio('materiais','Nenhum material programado nesta obra.','Cadastre o que precisa chegar — piso, tinta, argamassa — e o sistema avisa no painel antes de travar o serviço.','+ Cadastrar o primeiro material')}</div>`;
  const l=ms.filter(m=>m.sit===S.tabMat).sort((a,b)=>D(a.ate)-D(b.ate));
  return top+`<div class="card">${l.length?l.map(m=>linhaMat(m,false)).join(''):`<div class="entry" style="color:var(--muted)">Nenhum item em “${S.tabMat}”.</div>`}</div>`;
}

function telaMais(){
  header({titulo:'Mais',sub:'Eng. Júnior · Engenheiro'});
  return `<div class="card mais">${MAIS.map(([k,l])=>`<button class="li" onclick="toast('${l}: fora deste mockup.')"><span style="color:var(--slate)">${ico(k)}</span><div class="b"><div class="t">${l}</div></div>${ico('chev',20)}</button>`).join('')}</div>`;
}

function render(){
  renderSide();
  const T={hoje:telaHoje,frentes:telaFrentes,frente:telaFrente,diario:telaDiario,dia:telaDia,materiais:telaMateriais,mais:telaMais};
  document.getElementById('view').innerHTML=T[S.tela]();
}
render();
</script>
</body>
</html>
